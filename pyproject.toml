[project]
name = "pacman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BilalOrabi", email = "bilalorabi99@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
pacman = "pacman:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]
